<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendario · Family Cloud</title>
  <link rel="stylesheet" href="/styles.css" />
  <script>
    // Tema antes de pintar: evita el destello del tema por defecto al cargar.
    // Lee lo mismo que common.js (localStorage 'theme' y 'palette').
    (function () {
      try {
        var t = localStorage.getItem('theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.add(t);
        var p = localStorage.getItem('palette') || 'mar';
        if (p !== 'default') document.documentElement.dataset.palette = p;
      } catch (e) { /* sin localStorage: tema por defecto */ }
    })();
  </script>
  <link rel="icon" href="data:," />
</head>
<body>
  <!-- Interruptor de tema: por defecto sigue al sistema; el botón fuerza y recuerda -->
  <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">🌙</button>

  <div id="app">
    <header class="topbar">
      <div class="brand">☁️ <span>Family Cloud</span></div>
      <nav class="tabs">
        <a class="tab" href="/">🏠 Inicio</a>
        <button class="tab active">🗓️ Calendario</button>
      </nav>
      <div class="userbox">
        <span id="who" class="muted"></span>
        <button id="btn-logout" class="btn ghost">Salir</button>
      </div>
    </header>

    <!-- Vista calendario -->
    <main id="view-cal">
      <div class="cal-toolbar">
        <button id="prev" class="btn ghost" aria-label="Anterior">‹</button>
        <h2 id="cal-title"></h2>
        <button id="next" class="btn ghost" aria-label="Siguiente">›</button>
        <button id="today" class="btn ghost">Hoy</button>
        <div id="filters" class="filters"></div>
      </div>
      <div class="cal-wrap">
        <div class="cal-weekdays" id="weekdays"></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <!-- Proximos eventos -->
      <section class="upcoming">
        <h2>📅 Próximos eventos</h2>
        <ul id="upcoming-list" class="upcoming-list"></ul>
        <p id="upcoming-empty" class="muted hidden">No hay eventos próximos (próximos 3 meses).</p>
      </section>
    </main>
  </div>

  <!-- ===== Modal de evento ===== -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button type="button" id="modal-close" class="modal-x" title="Cerrar" aria-label="Cerrar">✕</button>
      <h3 id="modal-title"></h3>
      <form id="event-form">
        <div class="row">
          <label>Título <input id="ev-title" maxlength="120" required /></label>
        </div>
        <div class="row">
          <label>Desde <input id="ev-date" type="date" required /></label>
          <label>Hasta <input id="ev-end" type="date" /></label>
        </div>
        <div class="row">
          <label>Hora inicio <input id="ev-start" type="time" /></label>
          <label>Hora fin <input id="ev-end-time" type="time" /></label>
        </div>
        <div class="row">
          <label>Categoría
            <select id="ev-cat">
              <option value="cumple">🎂 Cumpleaños</option>
              <option value="comida">🍝 Comida</option>
              <option value="viaje">✈️ Viaje</option>
              <option value="tarea">🔧 Tarea</option>
              <option value="salud">🩺 Salud</option>
              <option value="ocio">🎉 Ocio</option>
              <option value="cole">🎓 Cole</option>
              <option value="otro">📌 Otro</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>Notas <textarea id="ev-desc" rows="4" maxlength="2000"></textarea></label>
        </div>
        <p id="ev-author" class="event-author hidden"></p>
        <div class="modal-actions">
          <button type="button" id="ev-delete" class="btn danger hidden">Eliminar</button>
          <span class="spacer"></span>
          <button type="button" id="ev-cancel" class="btn ghost">Cancelar</button>
          <button type="submit" id="ev-save" class="btn primary">Guardar</button>
        </div>
        <p id="modal-error" class="error hidden"></p>
      </form>
    </div>
  </div>

  <script src="/common.js"></script>
  <script src="/calendar.js"></script>
</body>
</html>
