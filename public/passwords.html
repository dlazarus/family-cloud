<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contraseñas · Family Cloud</title>
  <link rel="stylesheet" href="/styles.css" />
  <script>
    // Tema antes de pintar: evita el destello del tema por defecto al cargar.
    // Lee lo mismo que common.js (localStorage 'theme' y 'palette').
    (function () {
      try {
        var t = localStorage.getItem('theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.add(t);
        var p = localStorage.getItem('palette');
        if (p && p !== 'default') document.documentElement.dataset.palette = p;
      } catch (e) { /* sin localStorage: tema por defecto */ }
    })();
  </script>
  <link rel="icon" href="data:," />
</head>
<body>
  <!-- Interruptor de tema: por defecto sigue al sistema; el botón fuerza y recuerda -->
  <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">🌙</button>

  <div id="app">
    <header class="topbar">
      <div class="brand">☁️ <span>Family Cloud</span></div>
      <nav class="tabs">
        <a class="tab" href="/">🏠 Inicio</a>
        <button class="tab active">🔑 Contraseñas</button>
      </nav>
      <div class="userbox">
        <span id="who" class="muted"></span>
        <button id="btn-logout" class="btn ghost">Salir</button>
      </div>
    </header>

    <main id="view-vault">
      <div class="vault-toolbar">
        <input id="vault-search" placeholder="🔍 Buscar por sitio o acceso…" autocomplete="off" />
        <button id="gen-open" class="btn">🎲 Generador</button>
        <button id="vault-new" class="btn primary">➕ Nueva</button>
      </div>
      <div id="vault-list" class="vault-list"></div>
      <p id="vault-empty" class="muted hidden">Aún no tienes contraseñas guardadas. Pulsa «➕ Nueva» para crear la primera.</p>
      <p id="vault-note" class="muted vault-note">🔒 Solo tú puedes ver y gestionar tus contraseñas. Nadie más (ni el administrador) tiene acceso a ellas desde la web.</p>
    </main>
  </div>

  <!-- ===== Modal crear/editar ===== -->
  <div id="vault-modal" class="modal hidden">
    <div class="modal-card">
      <button type="button" id="vault-modal-close" class="modal-x" title="Cerrar" aria-label="Cerrar">✕</button>
      <h3 id="vault-modal-title"></h3>
      <form id="vault-form">
        <div class="row"><label>Sitio <input id="v-site" maxlength="120" placeholder="p. ej. google.com" required /></label></div>
        <div class="row"><label>Nombre de acceso <input id="v-login" maxlength="120" placeholder="p. ej. pepito@correo.com" required /></label></div>
        <div class="row">
          <label>Contraseña
            <div class="pass-field">
              <input id="v-pass" type="password" maxlength="512" autocomplete="new-password" required />
              <button type="button" id="v-pass-eye" class="icon-btn" title="Mostrar/ocultar">👁</button>
              <button type="button" id="v-pass-gen" class="icon-btn" title="Generar contraseña segura">🎲</button>
            </div>
          </label>
        </div>

        <!-- Mini-generador -->
        <div id="gen-panel" class="gen-panel hidden">
          <div class="gen-row">
            <code id="gen-preview" class="gen-preview"></code>
          </div>
          <div class="gen-row">
            <label class="gen-len">Longitud <input id="gen-len" type="range" min="8" max="64" value="20" /> <span id="gen-len-val">20</span></label>
          </div>
          <div class="gen-row gen-flags">
            <label class="chip-filter"><input id="g-upper" type="checkbox" checked /> MAYÚSC.</label>
            <label class="chip-filter"><input id="g-lower" type="checkbox" checked /> minúsc.</label>
            <label class="chip-filter"><input id="g-digits" type="checkbox" checked /> 123</label>
            <label class="chip-filter"><input id="g-symbols" type="checkbox" checked /> !@#$</label>
            <label class="chip-filter"><input id="g-avoid" type="checkbox" /> evitar ambiguos (lIO01)</label>
          </div>
          <div class="gen-row gen-actions">
            <button type="button" id="gen-again" class="btn ghost">🎲 Regenerar</button>
            <button type="button" id="gen-use" class="btn primary">Usar esta</button>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" id="v-delete" class="btn danger hidden">Eliminar</button>
          <span class="spacer"></span>
          <button type="button" id="v-cancel" class="btn ghost">Cancelar</button>
          <button type="submit" class="btn primary">Guardar</button>
        </div>
        <p id="vault-error" class="error hidden"></p>
      </form>
    </div>
  </div>

  <!-- ===== Generador independiente (sin editar ninguna entrada) ===== -->
  <div id="gen-modal" class="modal hidden">
    <div class="modal-card">
      <button type="button" id="gen-modal-close" class="modal-x" title="Cerrar" aria-label="Cerrar">✕</button>
      <h3>🎲 Generador de contraseñas seguras</h3>
      <div class="gen-panel">
        <div class="gen-row">
          <code id="sg-preview" class="gen-preview"></code>
        </div>
        <div class="gen-row">
          <label class="gen-len">Longitud <input id="sg-len" type="range" min="8" max="64" value="20" /> <span id="sg-len-val">20</span></label>
        </div>
        <div class="gen-row gen-flags">
          <label class="chip-filter"><input id="sg-upper" type="checkbox" checked /> MAYÚSC.</label>
          <label class="chip-filter"><input id="sg-lower" type="checkbox" checked /> minúsc.</label>
          <label class="chip-filter"><input id="sg-digits" type="checkbox" checked /> 123</label>
          <label class="chip-filter"><input id="sg-symbols" type="checkbox" checked /> !@#$</label>
          <label class="chip-filter"><input id="sg-avoid" type="checkbox" /> evitar ambiguos (lIO01)</label>
        </div>
        <div class="gen-row gen-actions">
          <button type="button" id="sg-again" class="btn ghost">🎲 Regenerar</button>
          <button type="button" id="sg-copy" class="btn primary">📋 Copiar</button>
        </div>
      </div>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button type="button" id="sg-close" class="btn ghost">Cerrar</button>
      </div>
      <p id="gen-modal-error" class="error hidden"></p>
    </div>
  </div>

  <script src="/common.js"></script>
  <script src="/passwords.js"></script>
</body>
</html>
