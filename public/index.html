<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Family Cloud</title>
  <link rel="stylesheet" href="/styles.css" />
  <script>
    // Tema antes de pintar: evita el destello del tema por defecto al cargar.
    // Lee lo mismo que common.js (localStorage 'theme' y 'palette').
    (function () {
      try {
        var t = localStorage.getItem('theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.add(t);
        var p = localStorage.getItem('palette');
        if (p && p !== 'default') document.documentElement.dataset.palette = p;
      } catch (e) { /* sin localStorage: tema por defecto */ }
    })();
  </script>
  <link rel="icon" href="data:," />
</head>
<body>
  <!-- Interruptor de tema: por defecto sigue al sistema; el botón fuerza y recuerda -->
  <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">🌙</button>

  <!-- ===== Pantalla pública: login / primera configuración ===== -->
  <div id="gate" class="gate hidden">
    <div class="gate-card">
      <div class="gate-logo">☁️</div>
      <h1 id="gate-title">Family Cloud</h1>
      <p id="gate-sub" class="muted">Inicia sesión para acceder a los servicios de casa.</p>

      <form id="setup-form" class="hidden">
        <label>Usuario <input id="setup-user" value="admin" autocomplete="username" /></label>
        <label>Contraseña <span class="pw-wrap"><input id="setup-pass" type="password" autocomplete="new-password" /><button type="button" class="pw-eye" aria-label="Mostrar u ocultar contraseña" title="Mostrar u ocultar">👁</button></span></label>
        <label>Repite la contraseña <span class="pw-wrap"><input id="setup-pass2" type="password" autocomplete="new-password" /><button type="button" class="pw-eye" aria-label="Mostrar u ocultar contraseña" title="Mostrar u ocultar">👁</button></span></label>
        <button type="submit" class="btn primary">Crear administrador</button>
      </form>

      <form id="login-form" class="hidden" autocomplete="off">
        <label>Usuario <input id="login-user" autocomplete="off" /></label>
        <label>Contraseña <span class="pw-wrap"><input id="login-pass" type="password" autocomplete="new-password" /><button type="button" class="pw-eye" aria-label="Mostrar u ocultar contraseña" title="Mostrar u ocultar">👁</button></span></label>
        <button type="submit" class="btn primary">Entrar</button>
      </form>

      <p id="gate-error" class="error hidden"></p>
    </div>
  </div>

  <!-- ===== Hub de servicios (autenticado) ===== -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">☁️ <span>Family Cloud</span></div>
      <nav class="tabs">
        <button class="tab active">🏠 Inicio</button>
      </nav>
      <div class="userbox">
        <span id="who" class="muted"></span>
        <button id="btn-logout" class="btn ghost">Salir</button>
      </div>
    </header>
    <main class="hub-grid" id="hub"></main>
  </div>

  <script src="/common.js"></script>
  <script src="/home.js"></script>
</body>
</html>
